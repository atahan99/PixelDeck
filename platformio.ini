; Atom Matrix four-mode firmware (rainbow / static / animated / Wi-Fi)
; Build: pio run
; M5Burner package: pio run -t firmware

[platformio]
default_envs = firmware

[env]
custom_firmware_version = 1.0.0
custom_firmware_name = pixeldeck
custom_firmware_suffix = .bin
custom_firmware_dir = firmware

platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_ldf_mode = deep
build_type = release
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DMAX_BRIGHTNESS=20
lib_deps =
	m5stack/M5Unified@^0.2.7
	adafruit/Adafruit NeoPixel@^1.15.1

[env:firmware]
extra_scripts = post:generate_user_custom.py
